name: "setup-lade"
description: "Install lade and age-plugin-lade (download a pinned or latest release, verify its SHA256 checksum, and add the directory to PATH)."
author: "zifeo"

branding:
  icon: "lock"
  color: "blue"

inputs:
  version:
    description: 'lade version to install (without leading "v"), or "latest".'
    required: false
    default: "latest"
  out-dir:
    description: "Directory to install lade and age-plugin-lade into (added to PATH)."
    required: false
    default: "${{ github.workspace }}/.lade-bin"

runs:
  using: "composite"
  steps:
    # "latest" is resolved before the cache key, or the first cached binary
    # would be restored for every later release.
    - name: Resolve lade version
      id: version
      shell: bash
      env:
        LADE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$LADE_VERSION" = "latest" ]; then
          url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/zifeo/lade/releases/latest)
          version="${url##*/v}"
        else
          version="${LADE_VERSION#v}"
        fi
        case "$version" in
        [0-9]*) ;;
        *)
          echo "Could not resolve lade version '$LADE_VERSION'." >&2
          exit 1
          ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache lade binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.out-dir }}
        key: lade-bins-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install lade
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT_DIR"
        if [ ! -x "$OUT_DIR/lade" ] || [ ! -x "$OUT_DIR/age-plugin-lade" ]; then
          # GITHUB_PATH puts OUT_DIR on PATH, so the installer leaves the
          # runner's shell profile as it is.
          CI=1 OUT_DIR="$OUT_DIR" VERSION="$VERSION" PATH="$(realpath "$OUT_DIR"):$PATH" \
            bash "$GITHUB_ACTION_PATH/installer.sh"
        fi
        echo "$OUT_DIR" >> "$GITHUB_PATH"
        "$OUT_DIR/lade" --version
