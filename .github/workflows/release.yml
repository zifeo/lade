name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-bump:
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Check version
        run: |
          VERSION=$(cargo run -- --version | cut -d' ' -f2)
          # shellcheck disable=SC2193
          if [[ "${{ github.ref_name }}" != "v$VERSION" ]]; then
            echo "Tag does not match code version v$VERSION, stopping."
            exit 1
          fi
          echo "Releasing v$VERSION"
      - uses: taiki-e/install-action@v2
        with:
          tool: parse-changelog@0.6.16
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Leaving title and notes unchanged."
            exit 0
          fi
          parse-changelog CHANGELOG.md "$version" > release-notes.md
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest=false

  crates:
    needs:
      - check-bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true

  binaries:
    needs:
      - check-bump
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_cmd: cargo
          - os: macos-15
            target: aarch64-apple-darwin
            build_cmd: cargo
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_cmd: cross
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            build_cmd: cross
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            build_cmd: cross
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            build_cmd: cross
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Install cross
        if: matrix.build_cmd == 'cross'
        run: curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin
      - name: Build
        run: ${{ matrix.build_cmd }} build --locked --release --target ${{ matrix.target }} -p lade -p age-plugin-lade
      - name: Compress
        shell: bash
        run: |
          mv "target/${{ matrix.target }}/release/lade" .
          mv "target/${{ matrix.target }}/release/age-plugin-lade" .
          asset="lade-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czvf "$asset" lade age-plugin-lade
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          asset="lade-${tag}-${{ matrix.target }}.tar.gz"
          published="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for file in "$asset" "$asset.sha256"; do
            if printf '%s\n' "$published" | grep -Fxq "$file"; then
              echo "$file is already on $tag. Leaving it unchanged."
              continue
            fi
            gh release upload "$tag" "$file"
          done

  mark-latest:
    needs:
      - binaries
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --latest

  bump:
    needs:
      - crates
      - binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Bump version
        id: bump
        run: |
          cargo install cargo-edit
          VERSION="$(bash scripts/set-version.sh --bump beta)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: bump-${{ steps.bump.outputs.version }}
          delete-branch: true
          commit-message: "chore: prepare release ${{ steps.bump.outputs.version }}"
          title: "chore: prepare release ${{ steps.bump.outputs.version }}"
          body: "Automatic suggested bump"
          base: main
