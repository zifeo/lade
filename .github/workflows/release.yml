name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.19.0
        required: true
        type: string

jobs:
  check-bump:
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Check version
        run: |
          VERSION=$(cargo run -- --version | cut -d' ' -f2)
          # shellcheck disable=SC2193
          if [[ "${{ github.ref_name }}" != "v$VERSION" ]]; then
            echo "Tag does not match code version v$VERSION, stopping."
            exit 1
          fi
          echo "Releasing v$VERSION"
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          makeLatest: false
          generateReleaseNotes: true

  crates:
    needs:
      - check-bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true

  binaries:
    needs:
      - check-bump
    # A manual run rebuilds a tag that already exists. check-bump is skipped then.
    if: ${{ !cancelled() && (needs.check-bump.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            build_cmd: cargo
          - os: macos-15
            target: aarch64-apple-darwin
            build_cmd: cargo
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_cmd: cross
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            build_cmd: cross
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            build_cmd: cross
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            build_cmd: cross
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - name: Check dispatch tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Tag must look like vX.Y.Z" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Install cross
        if: matrix.build_cmd == 'cross'
        run: curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.cargo/bin
      - name: Build
        run: ${{ matrix.build_cmd }} build --locked --release --target ${{ matrix.target }} -p lade -p age-plugin-lade
      - name: Compress
        shell: bash
        run: |
          mv "target/${{ matrix.target }}/release/lade" .
          mv "target/${{ matrix.target }}/release/age-plugin-lade" .
          asset="lade-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar czvf "$asset" lade age-plugin-lade
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - name: Upload
        uses: svenstaro/upload-release-action@v2
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          file: lade-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz*
          file_glob: true
          overwrite: false

  mark-latest:
    needs:
      - binaries
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.binaries.result == 'success' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    steps:
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          allowUpdates: true
          makeLatest: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true

  bump:
    needs:
      - crates
      - binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}
      - name: Bump version
        id: bump
        run: |
          cargo install cargo-edit
          VERSION="$(bash scripts/set-version.sh --bump beta)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: bump-${{ steps.bump.outputs.version }}
          delete-branch: true
          commit-message: "chore: prepare release ${{ steps.bump.outputs.version }}"
          title: "chore: prepare release ${{ steps.bump.outputs.version }}"
          body: "Automatic suggested bump"
          base: main
