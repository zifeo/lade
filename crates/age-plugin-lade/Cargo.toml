[package]
name = "age-plugin-lade"
version = "0.19.0"
edition = "2024"
description = "age plugin that hydrates Lade secret URIs"
license = "MPL-2.0"
repository = "https://github.com/zifeo/lade"

[dependencies]
anyhow = "1.0.104"
age = { version = "0.12.1", default-features = false, features = [
  "ssh",
  "armor",
  "plugin",
] }
age-core = "0.12.0"
age-plugin = "0.7.0"

[target.'cfg(target_family = "unix")'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3"
temp-env = "0.3"
tempfile = "3.27.0"

[[bin]]
name = "age-plugin-lade"
path = "src/main.rs"
