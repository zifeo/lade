.:
  .:
    silence: true
  cargo: mise://core/rust@1.96.0
  rustc: mise://core/rust@1.96.0
  op: mise://aqua/1password/op@>=2.18.0
  fish: mise://aqua/fish-shell/fish-shell@>=4.0.0,<5
  zsh: mise://github/romkatv/zsh-bin@>=6.0.0,<7
  kubectl: mise://aqua/kubernetes/kubectl@>=1.27.0
  k3d: mise://aqua/k3d-io/k3d@>=5.0.0,<6
  vault: mise://aqua/hashicorp/vault@>=1.15.0

"^git ":
  - .:
      when: agent
    SSH_AUTH_SOCK: sh://launchctl getenv SSH_AUTH_SOCK

# Vault docker tests run `echo e` from the repo root.
^echo e:
  # export VAULT_TOKEN=token
  # curl -H "X-Vault-Token: token" -H "Content-Type: application/json" -X POST \
  #   http://127.0.0.1:8200/v1/secret/data/password \
  #   --data '{"data":{"value1":"itsasecret","value2":"itsanotsecret","multiline":"a\\nb"}}'
  E1: vault://127.0.0.1:8200/secret/password/value1
  E2: vault://127.0.0.1:8200/secret/password/value2
  E3: vault://127.0.0.1:8200/secret/org%2Fteam/value
  E4: vault://127.0.0.1:8200/secret/password/multiline
