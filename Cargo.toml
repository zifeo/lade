[workspace]
members = [
  "crates/lade-sdk",
  "crates/age-plugin-lade",
]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "lade"
version = "0.18.1-beta.1"
edition = "2024"
default-run = "lade"
description = "Temporary access to secrets and private networks for one command, then gone. Same wrap for humans and agents. See which access was used."
license = "MPL-2.0"
repository = "https://github.com/zifeo/lade"

[dependencies]
anyhow = "1.0.104"
self_update = { version = "1.3.0", default-features = false, features = [
  "reqwest",
  "rustls",
  "progress-bar",
  "github",
  "archive-tar",
  "compression-tar-gz",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
fancy-regex = "0.19"
lade-sdk = { path = "./crates/lade-sdk", version = "0.18.1-beta.1" }
tokio = { version = "1", features = ["rt", "macros", "fs", "time", "signal", "io-std", "io-util", "process"] }
indexmap = { version = "2.14.2", features = ["serde"] }
clap-verbosity-flag = "3.0.4"
env_logger = { version = "0.11.11", default-features = false, features = [
  "auto-color",
  "humantime",
] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
futures = "0.3.34"
directories = "6.0.0"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
  "serde",
] }
log = "0.4.34"
semver = "1.0.28"
textwrap = "0.16.2"
owo-colors = "4.4.0"
aho-corasick = "1.1.5"
rustc-hash = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
url = "2.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uuid = { version = "1.26.0", features = ["v7"] }
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
toml = "1.1"
toml_edit = "0.23"
[features]
default = ["docker-tests"]
docker-tests = []

[target.'cfg(target_family = "unix")'.dependencies]
nix = { version = "0.31.3", features = ["signal", "term", "process"] }
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3"
temp-env = "0.3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "lade"
path = "src/main.rs"

[[bench]]
name = "redact"
harness = false

[[test]]
name = "docker"
path = "tests/docker/main.rs"
required-features = ["docker-tests"]
