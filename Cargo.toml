[workspace]
members = [
  "sdk",
]
resolver = "2"

[package]
name = "lade"
version = "0.18.1-beta.1"
edition = "2024"
default-run = "lade"
description = "Temporary access to secrets, files, and private networks for one command, then gone. Same wrap for humans and agents. See which access was used."
license = "MPL-2.0"
repository = "https://github.com/zifeo/lade"

[dependencies]
anyhow = "1.0.104"
self_update = { version = "1.3.0", default-features = false, features = [
  "reqwest",
  "rustls",
  "progress-bar",
  "github",
  "archive-tar",
  "compression-tar-gz",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
fancy-regex = "0.19"
lade-sdk = { path = "./sdk", version = "0.18.1-beta.1" }
tokio = { version = "1", features = ["rt", "macros", "fs", "time", "signal", "io-std", "io-util", "process"] }
indexmap = { version = "2.14.2", features = ["serde"] }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.11"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
futures = "0.3.34"
directories = "6.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
semver = "1.0.28"
textwrap = "0.16.2"
owo-colors = "4.4.0"
aho-corasick = "1.1.5"
rustc-hash = "2"
base64 = "0.23.1"
sha2 = "0.11.0"
hex = "0.4.3"
url = "2.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uuid = { version = "1.26.0", features = ["v7"] }
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
age = { version = "0.12.1", default-features = false, features = ["ssh"] }
age-plugin = "0.7.0"
age-core = "0.12.0"

[features]
default = ["docker-tests"]
docker-tests = []

[target.'cfg(target_family = "unix")'.dependencies]
nix = { version = "0.31.3", features = ["signal", "term", "process"] }
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3"
temp-env = "0.3"
serde_json = "1.0.151"
criterion = { version = "0.8", features = ["html_reports"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[bin]]
name = "lade"
path = "src/main.rs"

# C2SP-specific: age/rage look up `age-plugin-<name>` on PATH.
# Same program as `lade`, not a second crate. Cargo compiles it twice.
# `lade upgrade` still copies the new `lade` onto this name: self_update
# extracts one `bin_name` (`extract_file`). See src/upgrade/mod.rs.
[[bin]]
name = "age-plugin-lade"
path = "src/main.rs"
test = false
bench = false

[[bench]]
name = "redact"
harness = false

[[test]]
name = "docker"
path = "tests/docker/main.rs"
required-features = ["docker-tests"]
